name: Full Flutter CI (dev)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "README.md"
  # push:
  #   branches:
  #     - dev
  #   paths-ignore:
  #     - "docs/**"
  #     - "README.md"

permissions:
  contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
